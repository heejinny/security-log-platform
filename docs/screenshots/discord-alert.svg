<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <!-- Discord 다크 배경 -->
  <rect width="760" height="440" rx="12" fill="#2b2d31"/>

  <!-- 봇 헤더 -->
  <circle cx="44" cy="46" r="18" fill="#5865F2"/>
  <text x="44" y="52" text-anchor="middle" font-size="18">🛡️</text>
  <text x="74" y="42" fill="#f2f3f5" font-size="16" font-weight="700">Security Bot</text>
  <rect x="182" y="31" width="34" height="16" rx="4" fill="#5865F2"/>
  <text x="199" y="43" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">앱</text>
  <text x="228" y="42" fill="#949ba4" font-size="12">오늘 15:00</text>

  <!-- Embed 카드 (왼쪽 빨강 = CRITICAL/HIGH 강조) -->
  <rect x="74" y="60" width="640" height="344" rx="6" fill="#313338"/>
  <rect x="74" y="60" width="5" height="344" rx="2" fill="#e74c3c"/>

  <!-- 타이틀 -->
  <text x="98" y="98" fill="#f2f3f5" font-size="20" font-weight="700">🚨 Security Alert</text>

  <!-- 필드 3개 (inline) -->
  <text x="98"  y="138" fill="#b5bac1" font-size="12" font-weight="700">공격 종류</text>
  <text x="98"  y="160" fill="#dbdee1" font-size="15">BRUTE_FORCE</text>

  <text x="308" y="138" fill="#b5bac1" font-size="12" font-weight="700">IP / 호스트</text>
  <text x="308" y="160" fill="#dbdee1" font-size="15">203.0.113.2</text>

  <text x="508" y="138" fill="#b5bac1" font-size="12" font-weight="700">위험도</text>
  <text x="508" y="160" fill="#e74c3c" font-size="15" font-weight="700">HIGH (60점)</text>

  <!-- AI 분석 -->
  <text x="98" y="200" fill="#b5bac1" font-size="12" font-weight="700">AI 분석</text>
  <text x="98" y="224" fill="#dbdee1" font-size="14">
    <tspan x="98" dy="0">동일한 IP(203.0.113.2)에서 반복적인 로그인 실패가 발생하여</tspan>
    <tspan x="98" dy="24">Brute Force 공격으로 의심됩니다. 성공 시 계정 탈취로 이어질 수</tspan>
    <tspan x="98" dy="24">있으므로, 해당 IP를 차단하고 대상 계정의 비밀번호 변경 및</tspan>
    <tspan x="98" dy="24">다중 인증(MFA) 적용을 권장합니다.</tspan>
  </text>

  <!-- 근거 로그 -->
  <rect x="98" y="316" width="592" height="58" rx="4" fill="#2b2d31"/>
  <text x="110" y="336" fill="#949ba4" font-size="11" font-family="monospace">2026-07-10 14:59:50 LOGIN FAILED user=admin ip=203.0.113.2  (x5)</text>
  <text x="110" y="358" fill="#f0b232" font-size="11" font-family="monospace">→ 5초 내 5회 실패 탐지 → Brute Force 승격</text>

  <!-- 푸터 -->
  <text x="98" y="396" fill="#949ba4" font-size="11">탐지 시각: 2026-07-10 14:59:50</text>
</svg>
